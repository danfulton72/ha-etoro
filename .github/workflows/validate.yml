name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements_test.txt

      - name: Compile integration
        run: python -m compileall -q custom_components/etoro

      - name: Run pyflakes
        run: pyflakes custom_components/etoro tests

      - name: Run tests
        run: pytest -q

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate integration with hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository with HACS
        uses: hacs/action@main
        with:
          category: integration
          # HACS reads repository topics and license from repository/default-branch
          # metadata. A PR cannot make those checks pass before its LICENSE has
          # reached main, so ignore only those repository-level checks on PRs.
          # Pushes to main, scheduled runs, and manual runs execute the full set.
          ignore: ${{ github.event_name == 'pull_request' && 'topics license' || '' }}

  version:
    name: Release version gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify manifest version changed and tag is unused
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          manifest_path = "custom_components/etoro/manifest.json"
          current = json.loads(Path(manifest_path).read_text())["version"]
          base_raw = subprocess.check_output(
              ["git", "show", f"origin/{__import__('os').environ['BASE_REF']}:{manifest_path}"],
              text=True,
          )
          base = json.loads(base_raw)["version"]

          if not re.fullmatch(r"\d+\.\d+\.\d+", current):
              raise SystemExit(f"manifest version must use MAJOR.MINOR.PATCH, got {current!r}")
          if current == base:
              raise SystemExit(
                  f"Every merged PR creates a release, so manifest.json must be bumped (still {current})."
              )

          tag = f"v{current}"
          existing = subprocess.run(
              ["git", "rev-parse", "-q", "--verify", f"refs/tags/{tag}"],
              check=False,
              stdout=subprocess.DEVNULL,
          )
          if existing.returncode == 0:
              raise SystemExit(f"Release tag {tag} already exists; choose a new manifest version.")

          print(f"Release version OK: {base} -> {current} ({tag})")
          PY
